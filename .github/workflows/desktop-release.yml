name: Desktop prerelease packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  WAILS_VERSION: v2.13.0
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  windows:
    name: Windows amd64 and arm64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Wails
        shell: pwsh
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${env:WAILS_VERSION}"

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows packages
        shell: pwsh
        run: wails build -clean -trimpath -s -platform "windows/amd64,windows/arm64" -nsis -installscope user

      - name: Collect Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/TODO-amd64.exe dist/TODO-windows-amd64.exe
          Copy-Item build/bin/TODO-arm64.exe dist/TODO-windows-arm64.exe
          Copy-Item build/bin/TODO-amd64-installer.exe dist/TODO-windows-amd64-installer.exe
          Copy-Item build/bin/TODO-arm64-installer.exe dist/TODO-windows-arm64-installer.exe

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Build Linux application
        run: wails build -clean -trimpath -s -platform linux/${{ matrix.arch }} -tags webkit2_41

      - name: Package Linux application
        run: scripts/package-linux.sh "${{ matrix.arch }}" "${RELEASE_TAG}"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Build macOS application
        run: wails build -clean -trimpath -s -platform darwin/${{ matrix.arch }}

      - name: Package macOS application
        run: |
          mkdir -p dist
          codesign --force --deep --sign - build/bin/TODO.app
          ditto -c -k --sequesterRsrc --keepParent build/bin/TODO.app "dist/TODO-macos-${{ matrix.arch }}.app.zip"
          hdiutil create -volname TODO -srcfolder build/bin/TODO.app -ov -format UDZO "dist/TODO-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub prerelease
    needs:
      - windows
      - linux
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TODO ${RELEASE_TAG}" \
            --prerelease \
            --generate-notes \
            --verify-tag
