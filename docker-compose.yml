services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-todo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-todo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing local/todo-attachments &&
      mc encrypt set sse-s3 local/todo-attachments
      '

  server:
    image: ${TODO_SERVER_IMAGE:-ghcr.io/mon3tr-v/todo-server:dev}
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TODO_LISTEN: ":8080"
      TODO_DATABASE_URL: postgres://todo:${POSTGRES_PASSWORD}@postgres:5432/todo?sslmode=disable
      TODO_JWT_SECRET: ${TODO_JWT_SECRET:?set TODO_JWT_SECRET}
      TODO_S3_ENDPOINT: minio:9000
      TODO_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-todo}
      TODO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TODO_S3_BUCKET: todo-attachments
      TODO_S3_SECURE: "false"
      TODO_ALLOW_SIGNUPS: "false"
      TODO_MAX_ATTACHMENT_MB: ${TODO_MAX_ATTACHMENT_MB:-25}
    ports:
      - "127.0.0.1:${TODO_SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
  minio-data:
